[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eai-lab"
version = "0.1.0"
description = "Evidence-bound runtime and simulation lab for EAI-based learning configurations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23,<5"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eai_lab = ["core/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
